name: CI

on:
  push:
  pull_request:

jobs:
  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck collector
        run: shellcheck scripts/collect.sh

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  smoke-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run collector
        run: |
          chmod +x scripts/collect.sh
          ./scripts/collect.sh --since "1 hour ago" --out evidence.json
      - name: Validate JSON
        run: python -c "import json; json.load(open('evidence.json'))"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps and analyze
        run: |
          pip install -r requirements.txt
          python logsentry.py evidence.json --output audit.xlsx --json findings.json
